<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Baby Keys</title>
<meta name="description" content="A keyboard game for babies and toddlers. Every key makes a colour, a shape and a sound, with letter-finding levels for when they're ready.">
<meta name="theme-color" content="#120d26">
<meta property="og:title" content="Baby Keys">
<meta property="og:description" content="A keyboard game for babies and toddlers. Every key makes a colour, a shape and a sound.">
<meta property="og:image" content="https://babykeys.link/og.jpg">
<meta property="og:url" content="https://babykeys.link">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root { --ink: #fff; --muted: rgba(255,255,255,.62); --glass: rgba(24,16,52,.78); --line: rgba(255,255,255,.14);
          --font: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", system-ui, sans-serif; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #120d26; color: var(--ink); font-family: var(--font); user-select: none; -webkit-user-select: none; touch-action: none; }
  body.playing { cursor: none; }
  body.playing.pointer, body.menu { cursor: auto; }
  canvas { display: block; width: 100vw; height: 100vh; }
  button { font: inherit; color: inherit; }

  #intro {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; pointer-events: none;
    transition: opacity .7s ease, transform .7s cubic-bezier(.3,1.6,.5,1);
    font: 900 clamp(40px, 9vw, 120px)/1 var(--font);
  }
  #title span {
    display: inline-block; white-space: pre;
    animation: hop 1.8s cubic-bezier(.4,0,.3,1) infinite;
    text-shadow: 0 .06em 0 rgba(0,0,0,.25), 0 0 .5em currentColor;
  }
  #intro small { font-size: .22em; font-weight: 600; color: rgba(255,255,255,.5); margin-top: 1.6em; letter-spacing: .02em; }
  #intro.gone { opacity: 0; transform: scale(1.25); }
  @keyframes hop {
    0%, 60%, 100% { transform: translateY(0) scale(1, 1); }
    20% { transform: translateY(-.28em) scale(.92, 1.1); }
    40% { transform: translateY(0) scale(1.12, .88); }
  }

  /* Settings button: quiet during play, wakes up when the mouse moves */
  #gear {
    position: fixed; top: 16px; right: 16px; z-index: 5; width: 48px; height: 48px; border-radius: 50%;
    display: grid; place-items: center; border: 1px solid var(--line); background: rgba(255,255,255,.08);
    cursor: pointer; opacity: .9; transition: opacity .4s, transform .2s, background .2s;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  #gear svg { width: 24px; height: 24px; transition: transform .6s cubic-bezier(.3,1.5,.5,1); }
  #gear:hover { background: rgba(255,255,255,.16); }
  #gear:hover svg { transform: rotate(90deg); }
  body.playing:not(.pointer) #gear { opacity: .18; }
  #gear:focus-visible, .mode:focus-visible, #play:focus-visible { outline: 3px solid #ffd23f; outline-offset: 3px; }

  .overlay {
    position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 16px;
    background: rgba(10,6,24,.55); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    opacity: 0; pointer-events: none; transition: opacity .3s ease;
  }
  .overlay.open { opacity: 1; pointer-events: auto; }
  .card {
    width: min(760px, 100%); max-height: calc(100vh - 32px); overflow: auto; box-sizing: border-box;
    background: var(--glass); border: 1px solid var(--line); border-radius: 32px; padding: 32px;
    box-shadow: 0 30px 80px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.12);
    transform: translateY(16px) scale(.96); transition: transform .45s cubic-bezier(.3,1.5,.5,1);
  }
  .overlay.open .card { transform: none; }
  .card h2 { margin: 0; font-size: 34px; font-weight: 900; letter-spacing: -.01em; }
  .card .sub { margin: 6px 0 22px; color: var(--muted); font-size: 17px; font-weight: 600; }
  .modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .mode {
    position: relative; text-align: left; cursor: pointer; padding: 18px 18px 20px; border-radius: 22px;
    border: 2px solid var(--line); background: rgba(255,255,255,.05); display: flex; flex-direction: column; gap: 8px;
    transition: transform .2s cubic-bezier(.3,1.6,.5,1), border-color .2s, background .2s;
  }
  .mode:hover:not(:disabled) { transform: translateY(-3px); background: rgba(255,255,255,.09); }
  .mode[aria-pressed="true"] { border-color: var(--c); background: color-mix(in srgb, var(--c) 18%, transparent); }
  .mode:disabled { opacity: .4; cursor: not-allowed; }
  .mode .icon { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; font-size: 26px; font-weight: 900;
    background: radial-gradient(circle at 30% 25%, color-mix(in srgb, var(--c) 40%, white), var(--c) 55%, color-mix(in srgb, var(--c) 70%, black));
    box-shadow: 0 6px 18px color-mix(in srgb, var(--c) 45%, transparent); }
  .mode b { font-size: 20px; font-weight: 900; }
  .mode small { color: var(--muted); font-size: 14.5px; line-height: 1.35; font-weight: 600; }
  .mode .age { position: absolute; top: 16px; right: 16px; font-size: 13px; font-weight: 800; padding: 4px 9px; border-radius: 99px; background: rgba(255,255,255,.1); color: var(--muted); }
  .mode .check { position: absolute; top: 14px; right: 14px; width: 26px; height: 26px; border-radius: 50%; background: var(--c); display: none; place-items: center; }
  .mode[aria-pressed="true"] .check { display: grid; }
  .mode[aria-pressed="true"] .age { display: none; }
  .foot { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 22px; flex-wrap: wrap; }
  .foot p { margin: 0; color: var(--muted); font-size: 14px; font-weight: 600; }
  #play {
    cursor: pointer; border: 0; border-radius: 99px; padding: 14px 30px; font-size: 18px; font-weight: 900; color: #1b1030;
    background: linear-gradient(90deg, #ff8fa3, #ffd23f, #7dffb0, #6fd3ff); box-shadow: 0 8px 24px rgba(255,210,63,.3);
    transition: transform .2s cubic-bezier(.3,1.6,.5,1);
  }
  #play:hover { transform: scale(1.05); }

  #hud {
    position: fixed; top: 18px; left: 50%; transform: translateX(-50%); z-index: 4; display: flex; gap: 10px;
    opacity: 0; transition: opacity .4s; pointer-events: none;
  }
  #hud.show { opacity: 1; }
  #hud span { padding: 10px 18px; border-radius: 99px; background: rgba(255,255,255,.08); border: 1px solid var(--line);
    font-size: 18px; font-weight: 800; color: var(--muted); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  #hud b { color: #fff; font-size: 24px; margin-left: 6px; display: inline-block; }
  #hud b.bump { animation: bump .45s cubic-bezier(.3,1.8,.5,1); }
  @keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.5); color: #ffd23f; } 100% { transform: scale(1); } }

  #gameover .card { width: min(460px, 100%); text-align: center; }
  .go-title { font-size: 44px; font-weight: 900; }
  .go-score { font-size: 120px; font-weight: 900; line-height: 1; margin: 10px 0 2px;
    background: linear-gradient(180deg, #fff, #ffd9f0); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 6px 24px rgba(255,150,220,.35)); }
  .go-label { color: var(--muted); font-weight: 700; font-size: 16px; }
  .badge { display: inline-block; margin: 16px 0 6px; padding: 8px 16px; border-radius: 99px; font-weight: 900; font-size: 17px; background: rgba(255,255,255,.1); }
  .badge.new { color: #1b1030; background: linear-gradient(90deg, #ffd23f, #ff8fa3); animation: wiggle 1s ease-in-out infinite; }
  @keyframes wiggle { 0%,100% { transform: rotate(-3deg) scale(1); } 50% { transform: rotate(3deg) scale(1.06); } }
  .rank { font-size: 24px; font-weight: 900; margin-top: 8px; }
  .rank small { display: block; font-size: 14px; color: var(--muted); font-weight: 700; margin-bottom: 2px; }
  .board { list-style: none; padding: 0; margin: 20px auto 0; max-width: 280px; text-align: left; counter-reset: r; }
  .board li { counter-increment: r; display: flex; justify-content: space-between; padding: 8px 14px; border-radius: 12px; font-weight: 800; color: var(--muted); }
  .board li::before { content: counter(r) "."; width: 28px; }
  .board li span { flex: 1; }
  .board li.me { background: rgba(255,210,63,.16); color: #fff; }
  .again { margin-top: 22px; font-weight: 800; color: var(--muted); opacity: 0; transition: opacity .4s; }
  .again.show { opacity: 1; animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .45; } }

  @media (max-width: 680px) {
    .modes { grid-template-columns: 1fr; }
    .card { padding: 22px; border-radius: 26px; }
    .go-score { font-size: 96px; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="intro">
  <div id="title"></div>
  <small id="intro-sub">Goes full screen · Esc to exit</small>
</div>

<button id="gear" aria-label="Choose a level">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
</button>

<div id="settings" class="overlay" role="dialog" aria-modal="true" aria-labelledby="settings-title">
  <div class="card">
    <h2 id="settings-title">Baby Keys</h2>
    <p class="sub">Pick a level. You can change it any time from the button in the corner.</p>
    <div class="modes">
      <button class="mode" data-mode="free" style="--c:#ff7a9c">
        <span class="icon">✦</span><span class="age">1+</span><span class="check"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg></span>
        <b>Free play</b>
        <small>Every key makes a shape, a colour and a sound. Just bash away.</small>
      </button>
      <button class="mode" data-mode="find" style="--c:#35c9ff">
        <span class="icon">A</span><span class="age">2+</span><span class="check"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg></span>
        <b>Find the letter</b>
        <small>Press the letter in the bubble to pop it. A little keyboard shows where it is.</small>
      </button>
      <button class="mode" data-mode="challenge" style="--c:#ffb321">
        <span class="icon">★</span><span class="age">4+</span><span class="check"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg></span>
        <b>Challenge</b>
        <small>Pop as many as you can. One wrong key and it's game over. Beat your high score!</small>
      </button>
    </div>
    <div class="foot">
      <p id="settings-note">Tip: press Esc to leave full screen.</p>
      <button id="play">Let's play!</button>
    </div>
  </div>
</div>

<div id="hud"><span>Score<b id="score">0</b></span><span>Best<b id="best">0</b></span></div>

<div id="gameover" class="overlay" aria-live="polite">
  <div class="card">
    <div class="go-title">Game over!</div>
    <div class="go-score" id="go-score">0</div>
    <div class="go-label" id="go-label">letters popped</div>
    <div class="badge" id="go-badge"></div>
    <div class="rank" id="go-rank"></div>
    <ol class="board" id="go-board"></ol>
    <div class="again" id="go-again">Press any key to play again</div>
  </div>
</div>
<script>
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const TOUCH_ONLY = matchMedia('(hover: none) and (pointer: coarse)').matches;

// ---------- Level (mode) ----------
const MODES = ['free', 'find', 'challenge'];
const store = (area, k, v) => { try { if (v === undefined) return window[area].getItem(k); window[area].setItem(k, v); } catch { return null; } };
let mode = new URLSearchParams(location.search).get('mode') || store('localStorage', 'babykeys-mode') || 'free';
if (!MODES.includes(mode) || (TOUCH_ONLY && mode !== 'free')) mode = 'free';

// Rainbow bouncing title
const INTRO = {
  free: TOUCH_ONLY ? 'Tap anywhere!' : 'Press any key!',
  find: 'Find the letter!',
  challenge: 'Ready? Press a key!',
};
function setTitle() {
  const t = document.getElementById('title');
  t.innerHTML = '';
  [...INTRO[mode]].forEach((ch, i) => {
    const s = document.createElement('span');
    s.textContent = ch;
    s.style.color = `hsl(${(i * 28) % 360}, 95%, 70%)`;
    s.style.animationDelay = `${i * 0.07}s`;
    t.appendChild(s);
  });
  document.getElementById('intro-sub').textContent = TOUCH_ONLY ? 'Tap, tap, tap!' : 'Goes full screen · Esc to exit';
}
setTitle();

// ---------- Canvas ----------
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W, H, dpr;
function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
}
addEventListener('resize', resize);
resize();

// ---------- Audio ----------
let ac, master, noiseBuf;
function initAudio() {
  if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
  ac = new (window.AudioContext || window.webkitAudioContext)();
  const comp = ac.createDynamicsCompressor();
  comp.threshold.value = -18; comp.ratio.value = 6;
  comp.connect(ac.destination);
  master = ac.createGain();
  master.gain.value = 0.5;
  master.connect(comp);
  // Soft echo so every note feels a bit magical
  const delay = ac.createDelay(); delay.delayTime.value = 0.22;
  const fb = ac.createGain(); fb.gain.value = 0.28;
  const wet = ac.createGain(); wet.gain.value = 0.22;
  master.connect(delay); delay.connect(fb); fb.connect(delay); delay.connect(wet); wet.connect(comp);
  noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
}

function tone(f, { type = 'sine', t = 0, dur = 1, vol = 0.3, attack = 0.005, slideTo = null, slideTime = 0.15 } = {}) {
  if (!ac) return;
  const now = ac.currentTime + t;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f, now);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, now + slideTime);
  g.gain.setValueAtTime(0.0001, now);
  g.gain.exponentialRampToValueAtTime(vol, now + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
  o.connect(g); g.connect(master);
  o.start(now); o.stop(now + dur + 0.05);
}

function whoosh() {
  const now = ac.currentTime;
  const src = ac.createBufferSource(); src.buffer = noiseBuf;
  const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 2;
  bp.frequency.setValueAtTime(300, now);
  bp.frequency.exponentialRampToValueAtTime(3000, now + 0.6);
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, now);
  g.gain.exponentialRampToValueAtTime(0.25, now + 0.15);
  g.gain.exponentialRampToValueAtTime(0.0001, now + 0.8);
  src.connect(bp); bp.connect(g); g.connect(master);
  src.start(now); src.stop(now + 0.9);
}

// Pentatonic scale: every combination sounds nice
const PENTA = [0, 2, 4, 7, 9];
const note = (base, i) => base * Math.pow(2, (12 * Math.floor(i / 5) + PENTA[i % 5]) / 12);
const C3 = 130.81, C4 = 261.63, C5 = 523.25;

const instruments = {
  sparkle(f) { tone(f, { type: 'triangle', dur: 0.5, vol: 0.16 }); tone(f * 2, { t: 0.07, dur: 0.4, vol: 0.08 }); tone(f * 3, { t: 0.14, dur: 0.3, vol: 0.05 }); },
  bell(f)    { tone(f, { dur: 1.6, vol: 0.26 }); tone(f * 2, { dur: 0.8, vol: 0.08 }); tone(f * 2.76, { dur: 0.3, vol: 0.04 }); },
  marimba(f) { tone(f, { dur: 0.7, vol: 0.34 }); tone(f * 4, { dur: 0.08, vol: 0.1 }); },
  bubble(f)  { tone(f * 0.7, { slideTo: f * 1.5, slideTime: 0.12, dur: 0.35, vol: 0.3 }); },
};

// ---------- Keyboard layout -> screen position, pitch, sound ----------
const ROWS = ['1234567890', 'qwertyuiop', 'asdfghjkl', 'zxcvbnm'];
const ROW_SOUND = [
  { inst: 'sparkle', base: C5 },
  { inst: 'bell',    base: C4 },
  { inst: 'marimba', base: C3 },
  { inst: 'bubble',  base: C4 },
];

function keyInfo(code) {
  let ch = null;
  if (code.startsWith('Key')) ch = code.slice(3).toLowerCase();
  else if (code.startsWith('Digit')) ch = code.slice(5);
  if (ch) {
    for (let r = 0; r < ROWS.length; r++) {
      const c = ROWS[r].indexOf(ch);
      if (c !== -1) {
        const n = ROWS[r].length;
        return {
          label: ch.toUpperCase(),
          x: ((c + 0.5) / n) * 0.84 + 0.08,
          y: (r + 0.5) / ROWS.length * 0.8 + 0.1,
          hue: (c / n) * 320,
          ...ROW_SOUND[r], i: c,
        };
      }
    }
  }
  return null;
}

// ---------- World state ----------
const pops = [], rings = [], parts = [], rockets = [], rainbows = [];
const SHAPES = ['circle', 'star', 'heart', 'square', 'triangle', 'flower'];
const flashes = [];
let shake = 0;

// Big soft colour clouds in the background that drift and pick up the latest colour
const blobs = Array.from({ length: 4 }, (_, i) => ({
  hue: 230 + i * 30, target: 230 + i * 30,
  ax: rand(0.15, 0.3), ay: rand(0.12, 0.25), px: rand(0, TAU), py: rand(0, TAU),
}));
function tintBackground(hue) {
  const b = pick(blobs);
  b.target = b.hue + ((((hue - b.hue) % 360) + 540) % 360 - 180);
}

function addPart(p) { parts.push(p); if (parts.length > 1400) parts.splice(0, parts.length - 1400); }

function sparks(x, y, hue, { dots = 18, confetti = 10, twinkles = 6, speed = 1 } = {}) {
  for (let i = 0; i < dots; i++) {
    const a = rand(0, TAU), s = rand(180, 560) * speed;
    addPart({ kind: 'dot', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 100, hue: hue + rand(-25, 25), size: rand(3, 8), t: 0, life: rand(0.6, 1.2), drag: 0.25, g: 520 });
  }
  for (let i = 0; i < confetti; i++) {
    const a = rand(0, TAU), s = rand(200, 520) * speed;
    addPart({ kind: 'confetti', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 220, hue: hue + rand(-60, 60), size: rand(7, 13), rot: rand(0, TAU), vr: rand(-10, 10), t: 0, life: rand(1.2, 2), drag: 0.35, g: 380 });
  }
  for (let i = 0; i < twinkles; i++) {
    const a = rand(0, TAU), s = rand(40, 160) * speed;
    addPart({ kind: 'twinkle', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, hue: hue + rand(-20, 20), size: rand(6, 12), t: 0, life: rand(1.2, 2.2), drag: 0.15, g: -30 });
  }
}

function burst(x, y, hue, { label = '', face = false, size = 1, quiet = false } = {}) {
  const r = Math.min(W, H) * rand(0.1, 0.14) * size;
  pops.push({ x, y, hue, r, label, face, shape: pick(SHAPES), t: 0, life: quiet ? 3 : 2.2, rot: rand(-0.3, 0.3), seed: rand(0, 100), popped: false });
  if (pops.length > 40) pops.splice(0, pops.length - 40);
  if (quiet) return;
  rings.push({ x, y, hue, t: 0, life: 0.8, maxR: r * 2.8, w: 14 });
  rings.push({ x, y, hue: hue + 40, t: -0.08, life: 0.9, maxR: r * 3.6, w: 4 });
  sparks(x, y, hue, { speed: size });
  flashes.push({ x, y, hue, t: 0, life: 0.6 });
  tintBackground(hue);
  shake = Math.max(shake, 4 * size);
}

// Little sparkle puff when a shape disappears
function puff(o, s) {
  for (let i = 0; i < 14; i++) {
    const a = rand(0, TAU), rr = o.r * s * 0.9;
    addPart({ kind: 'dot', x: o.x + Math.cos(a) * rr, y: o.y + Math.sin(a) * rr, vx: Math.cos(a) * rand(60, 200), vy: Math.sin(a) * rand(60, 200), hue: o.hue + rand(-20, 20), size: rand(2, 5), t: 0, life: rand(0.4, 0.8), drag: 0.1, g: 60 });
  }
  for (let i = 0; i < 3; i++) addPart({ kind: 'twinkle', x: o.x + rand(-o.r, o.r) * 0.6, y: o.y + rand(-o.r, o.r) * 0.6, vx: 0, vy: rand(-40, -10), hue: o.hue, size: rand(6, 10), t: 0, life: rand(0.6, 1.1), drag: 0.2, g: 0 });
}

function rainbowBlast() {
  rainbows.push({ t: 0, life: 2.8 });
  for (let i = 0; i < 90; i++) {
    addPart({ kind: 'confetti', x: rand(0, W), y: rand(-H * 0.4, -10), vx: rand(-40, 40), vy: rand(80, 260), hue: rand(0, 360), size: rand(8, 14), rot: rand(0, TAU), vr: rand(-8, 8), t: 0, life: rand(2.5, 3.6), drag: 0.5, g: 260 });
  }
  const x = W / 2, y = H * 0.55;
  for (let i = 0; i < 5; i++) rings.push({ x, y, hue: i * 70, t: -i * 0.07, life: 1.1, maxR: Math.max(W, H) * 0.6, w: 12 });
  flashes.push({ x, y, hue: rand(0, 360), t: 0, life: 0.9, big: true });
  blobs.forEach((b, i) => { b.target = b.hue + (((((i * 90) - b.hue) % 360) + 540) % 360 - 180); });
  shake = 14;
}

function launchRocket(x, hue, delay) {
  rockets.push({ x, y: H + 10, vx: rand(-40, 40), vy: -Math.sqrt(2 * 900 * (H - H * rand(0.18, 0.42))), hue, wait: delay });
  setTimeout(() => tone(rand(300, 400), { type: 'triangle', slideTo: 1200, slideTime: 0.55, dur: 0.6, vol: 0.05 }), delay * 1000);
}

function explode(r) {
  instruments.sparkle(note(C5, Math.floor(rand(0, 8))));
  for (let i = 0; i < 70; i++) {
    const a = (i / 70) * TAU, s = rand(260, 420);
    addPart({ kind: 'dot', x: r.x, y: r.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, hue: r.hue + rand(-15, 15), size: rand(3, 6), t: 0, life: rand(1, 1.6), drag: 0.35, g: 220 });
  }
  sparks(r.x, r.y, r.hue, { dots: 0, confetti: 6, twinkles: 10 });
  rings.push({ x: r.x, y: r.y, hue: r.hue, t: 0, life: 0.7, maxR: 160, w: 6 });
  flashes.push({ x: r.x, y: r.y, hue: r.hue, t: 0, life: 0.5 });
  tintBackground(r.hue);
}

// ---------- Letter game (Find the letter + Challenge) ----------
const LETTERS = [...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'];
const DIGITS = [...'1234567890'];
const CHEERS = ['Yay!', 'Pop!', 'Wow!', 'Yes!', 'Great!', 'Hooray!', 'Super!'];
const RANKS = [
  [0, 'Little Sprout'], [3, 'Busy Bee'], [6, 'Bubble Popper'],
  [10, 'Letter Hunter'], [15, 'Key Captain'], [25, 'Keyboard Wizard'], [40, 'Alphabet Legend'],
];
const game = {
  target: null, score: 0, over: false, overAt: 0, streak: 0,
  best: +(store('sessionStorage', 'babykeys-best') || 0),
  scores: JSON.parse(store('sessionStorage', 'babykeys-scores') || '[]'),
};
const floaters = [];
let miniFlash = null, nextTargetTimer = 0;

function codeFor(ch) { return /\d/.test(ch) ? 'Digit' + ch : 'Key' + ch; }

function newTarget() {
  const pool = mode === 'challenge' && game.score >= 12 ? LETTERS.concat(DIGITS) : LETTERS;
  let ch;
  do ch = pick(pool); while (game.target && ch === game.target.label);
  const info = keyInfo(codeFor(ch));
  const yRange = mode === 'find' ? [0.2, 0.46] : [0.28, 0.68];
  game.target = {
    label: ch, info, hue: info.hue,
    x: rand(0.25, 0.75) * W, y: rand(...yRange) * H,
    r: Math.min(W, H) * (mode === 'find' ? 0.15 : 0.13),
    t: 0, wobble: 0, dying: false, dieT: 0,
  };
}

function beginGame() {
  game.score = 0; game.over = false; game.streak = 0; game.target = null;
  updateHud();
  document.getElementById('gameover').classList.remove('open');
  document.getElementById('go-again').classList.remove('show');
  clearTimeout(nextTargetTimer);
  nextTargetTimer = setTimeout(newTarget, 250);
}

function updateHud(bump) {
  document.getElementById('hud').classList.toggle('show', mode === 'challenge' && started);
  const sc = document.getElementById('score'), be = document.getElementById('best');
  sc.textContent = game.score; be.textContent = game.best;
  if (bump) { sc.classList.remove('bump'); void sc.offsetWidth; sc.classList.add('bump'); }
}

function floater(text, x, y, hue, size = 1) {
  floaters.push({ text, x, y, hue, t: 0, life: 1.1, size });
}

function hitTarget(k) {
  const g = game.target;
  game.target = null;
  stats.hits++;
  game.streak++;
  instruments[k.inst](note(k.base, k.i));
  tone(note(C5, 2 + (game.streak % 5)), { t: 0.08, dur: 0.5, vol: 0.12 });
  tone(note(C5, 5 + (game.streak % 5)), { t: 0.16, dur: 0.6, vol: 0.1 });
  // Bubble pop: rings, sparks, a flash and a wobbly shape with the letter
  rings.push({ x: g.x, y: g.y, hue: g.hue, t: 0, life: 0.7, maxR: g.r * 3.2, w: 16 });
  sparks(g.x, g.y, g.hue, { dots: 30, confetti: 18, twinkles: 10, speed: 1.3 });
  flashes.push({ x: g.x, y: g.y, hue: g.hue, t: 0, life: 0.7 });
  tintBackground(g.hue);
  shake = Math.max(shake, 7);
  if (mode === 'challenge') {
    game.score++;
    const isBest = game.score > game.best;
    if (isBest) { game.best = game.score; store('sessionStorage', 'babykeys-best', game.best); }
    updateHud(true);
    floater('+1', g.x, g.y - g.r * 0.4, g.hue, 1.2);
    if (game.score % 10 === 0) { rainbowBlast(); floater(`${game.score}!`, W / 2, H * 0.4, 50, 2); }
  } else {
    floater(pick(CHEERS), g.x, g.y - g.r * 0.4, g.hue);
    if (stats.hits % 5 === 0) rainbowBlast();
  }
  nextTargetTimer = setTimeout(newTarget, mode === 'challenge' ? 300 : 650);
}

function missTarget(k) {
  stats.misses++;
  miniFlash = { label: k.label, t: 0 };
  if (mode === 'find') {
    game.target.wobble = 1;
    game.streak = 0;
    tone(196, { type: 'triangle', slideTo: 150, slideTime: 0.2, dur: 0.28, vol: 0.14 });
    // a tiny faded sparkle where the wrong key sits, so it still feels responsive
    addPart({ kind: 'twinkle', x: k.x * W, y: k.y * H, vx: 0, vy: -30, hue: k.hue, size: 10, t: 0, life: 0.6, drag: 0.2, g: 0 });
  } else {
    gameOver();
  }
}

function rankFor(score) {
  let r = RANKS[0][1];
  for (const [min, name] of RANKS) if (score >= min) r = name;
  return r;
}

function gameOver() {
  game.over = true; game.overAt = performance.now(); stats.games++;
  if (game.target) { game.target.dying = true; game.target.wobble = 1; }
  // "wah wah wah waaah"
  [392, 370, 349].forEach((f, i) => tone(f, { type: 'triangle', t: i * 0.28, dur: 0.32, vol: 0.16 }));
  tone(330, { type: 'triangle', t: 0.84, dur: 1.1, vol: 0.16, slideTo: 300, slideTime: 1 });
  shake = 12;

  const s = game.score;
  const prevBest = Math.max(0, ...game.scores);
  const isNewBest = s > 0 && s > prevBest;
  game.scores.push(s);
  game.scores.sort((a, b) => b - a);
  store('sessionStorage', 'babykeys-scores', JSON.stringify(game.scores.slice(0, 20)));
  track('challenge_game_over', { score: s, new_high_score: isNewBest, games_this_session: game.scores.length });

  document.getElementById('go-score').textContent = s;
  document.getElementById('go-label').textContent = s === 1 ? 'letter popped' : 'letters popped';
  const badge = document.getElementById('go-badge');
  badge.className = 'badge' + (isNewBest ? ' new' : '');
  badge.textContent = isNewBest ? '★ New high score! ★' : `High score: ${game.best}`;
  document.getElementById('go-rank').innerHTML = `<small>You are a</small>${rankFor(s)}`;
  const board = document.getElementById('go-board');
  board.innerHTML = '';
  let marked = false;
  game.scores.slice(0, 5).forEach(v => {
    const li = document.createElement('li');
    li.innerHTML = `<span>${v === s && !marked ? 'This game' : 'Earlier'}</span>${v}`;
    if (v === s && !marked) { li.className = 'me'; marked = true; }
    board.appendChild(li);
  });
  setTimeout(() => {
    document.getElementById('gameover').classList.add('open');
    if (isNewBest) { rainbowBlast(); }
  }, 700);
  setTimeout(() => document.getElementById('go-again').classList.add('show'), 1800);
}

function freePlay(code, k) {
  if (k) {
    instruments[k.inst](note(k.base, k.i));
    burst(k.x * W + rand(-30, 30), k.y * H + rand(-30, 30), k.hue + rand(-10, 10), { label: k.label });
  } else if (code === 'Space') {
    tone(160, { slideTo: 45, slideTime: 0.5, dur: 0.9, vol: 0.5 });
    whoosh();
    [0, 2, 4, 7].forEach((i, n) => setTimeout(() => instruments.bell(note(C4, i + 5)), n * 70));
    rainbowBlast();
  } else if (code === 'Enter') {
    [0.2, 0.4, 0.6, 0.8].forEach((fx, n) => launchRocket(W * fx + rand(-40, 40), n * 80 + rand(0, 40), n * 0.12));
  } else if (code === 'Backspace' || code === 'Delete') {
    tone(700, { type: 'triangle', slideTo: 180, slideTime: 0.3, dur: 0.4, vol: 0.25 });
    burst(rand(0.15, 0.85) * W, rand(0.2, 0.8) * H, 200, { face: true, size: 1.2 });
  } else {
    instruments.bell(note(C4, Math.floor(rand(0, 10))));
    burst(rand(0.1, 0.9) * W, rand(0.15, 0.85) * H, rand(0, 360), { face: true });
  }
}

const MODIFIERS = /^(Shift|Control|Alt|Meta|CapsLock|Tab|Fn|OS)/;
addEventListener('keydown', e => {
  if (settingsOpen()) {
    if (e.code === 'Escape') closeSettings();
    return;                               // let Tab/Enter/Space work normally in the menu
  }
  e.preventDefault();
  if (e.code === 'Escape') return;       // let the browser exit full screen
  const wasStarted = started;
  start();
  if (e.repeat) return;                   // holding a key down shouldn't spam
  lastPress = performance.now();
  stats.presses++;
  const k = keyInfo(e.code);
  if (!k) stats.specials++;

  if (mode === 'free') return freePlay(e.code, k);
  if (!wasStarted) return;                // the first key only starts the game

  if (game.over) {
    if (performance.now() - game.overAt > 1800) beginGame();
    return;
  }
  if (!k) {                               // Space, arrows etc. don't count as wrong
    if (!MODIFIERS.test(e.code)) addPart({ kind: 'twinkle', x: rand(0.2, 0.8) * W, y: rand(0.2, 0.8) * H, vx: 0, vy: -20, hue: rand(0, 360), size: 9, t: 0, life: 0.6, drag: 0.2, g: 0 });
    return;
  }
  const g = game.target;
  if (!g || g.dying || g.t < 0.12) return; // ignore presses while the next bubble is arriving
  if (k.label === g.label) hitTarget(k);
  else missTarget(k);
});

addEventListener('pointerdown', e => {
  if (e.target.closest('#gear, .overlay')) return;
  start();
  lastPress = performance.now();
  stats.taps++;
  if (mode !== 'free') {
    addPart({ kind: 'twinkle', x: e.clientX, y: e.clientY, vx: 0, vy: -30, hue: rand(0, 360), size: 12, t: 0, life: 0.7, drag: 0.2, g: 0 });
    return;
  }
  const col = Math.min(9, Math.floor((e.clientX / W) * 10));
  const row = Math.min(3, Math.floor((e.clientY / H) * 4));
  instruments[ROW_SOUND[row].inst](note(ROW_SOUND[row].base, col));
  burst(e.clientX, e.clientY, (col / 10) * 320, { face: true });
});

});

// ---------- Drawing helpers ----------
function shapePath(s, r) {
  ctx.beginPath();
  if (s === 'circle') ctx.arc(0, 0, r, 0, TAU);
  else if (s === 'square') ctx.roundRect(-r * 0.85, -r * 0.85, r * 1.7, r * 1.7, r * 0.38);
  else if (s === 'triangle') {
    const pts = [0, 1, 2].map(i => { const a = -Math.PI / 2 + i * TAU / 3; return [Math.cos(a) * r * 1.2, Math.sin(a) * r * 1.2 + r * 0.2]; });
    // rounded corners
    for (let i = 0; i < 3; i++) {
      const [x1, y1] = pts[i], [x2, y2] = pts[(i + 1) % 3];
      if (i === 0) ctx.moveTo((x1 + x2) / 2, (y1 + y2) / 2);
      const [x3, y3] = pts[(i + 2) % 3];
      ctx.arcTo(x2, y2, (x2 + x3) / 2, (y2 + y3) / 2, r * 0.25);
    }
    ctx.closePath();
  }
  else if (s === 'star') {
    for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.58 : r * 1.18; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
    ctx.closePath(); ctx.lineJoin = 'round';
  }
  else if (s === 'heart') {
    for (let t = 0; t < TAU; t += 0.08) { const x = 16 * Math.sin(t) ** 3, y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t); ctx.lineTo(x * r / 15, -y * r / 15 - r * 0.1); }
    ctx.closePath();
  }
  else if (s === 'flower') {
    for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3, cx = Math.cos(a) * r * 0.6, cy = Math.sin(a) * r * 0.6; ctx.moveTo(cx + r * 0.46, cy); ctx.arc(cx, cy, r * 0.46, 0, TAU); }
    ctx.moveTo(r * 0.6, 0); ctx.arc(0, 0, r * 0.6, 0, TAU);
  }
}
const CENTER_Y = { triangle: 0.28, heart: -0.02 };

// Springy scale: 0 -> overshoot -> settle at 1
const spring = t => t <= 0 ? 0 : 1 - Math.exp(-7 * t) * Math.cos(15 * t);
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);

function drawFace(o, r, cy) {
  const blink = ((o.t + o.seed) % 3.2) < 0.12 ? 0.12 : 1;
  const look = Math.sin(o.t * 1.3 + o.seed) * r * 0.04;
  ctx.fillStyle = '#2b1838';
  for (const sx of [-1, 1]) {
    ctx.beginPath(); ctx.ellipse(sx * r * 0.28 + look, cy - r * 0.08, r * 0.09, r * 0.13 * blink, 0, 0, TAU); ctx.fill();
  }
  if (blink === 1) {
    ctx.fillStyle = '#fff';
    for (const sx of [-1, 1]) { ctx.beginPath(); ctx.arc(sx * r * 0.28 + look + r * 0.03, cy - r * 0.13, r * 0.035, 0, TAU); ctx.fill(); }
  }
  ctx.fillStyle = 'rgba(255,120,160,.45)';
  for (const sx of [-1, 1]) { ctx.beginPath(); ctx.ellipse(sx * r * 0.48, cy + r * 0.12, r * 0.12, r * 0.07, 0, 0, TAU); ctx.fill(); }
  ctx.strokeStyle = '#2b1838'; ctx.lineWidth = r * 0.06; ctx.lineCap = 'round';
  const open = o.t < 0.5 ? 1 : 0;   // "ooh!" first, then a smile
  ctx.beginPath();
  if (open) { ctx.fillStyle = '#2b1838'; ctx.ellipse(0, cy + r * 0.2, r * 0.09, r * 0.11, 0, 0, TAU); ctx.fill(); }
  else { ctx.arc(0, cy + r * 0.08, r * 0.2, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke(); }
}

function drawPop(o) {
  const t = o.t, r = o.r;
  const s = spring(t);
  const wob = Math.exp(-5 * t) * Math.sin(18 * t) * 0.22;
  let sx = s * (1 + wob), sy = s * (1 - wob), alpha = 1;
  const k = (t - (o.life - 0.45)) / 0.45;
  if (k > 0) {
    if (k < 0.6) { const e = 1 + 0.18 * Math.sin((k / 0.6) * Math.PI / 2); sx *= e; sy *= e; }
    else {
      if (!o.popped) { o.popped = true; puff(o, sx); }
      const e = 1.18 * (1 - easeOutCubic((k - 0.6) / 0.4)); sx *= e; sy *= e; alpha = 1 - (k - 0.6) / 0.4;
    }
  }
  sx = Math.max(sx, 0.001); sy = Math.max(sy, 0.001);
  const x = o.x + Math.sin(t * 1.7 + o.seed) * 6, y = o.y + Math.sin(t * 2.3 + o.seed) * 5;

  // soft glow
  ctx.globalCompositeOperation = 'lighter';
  const gr = r * 2.2 * sx;
  const g = ctx.createRadialGradient(x, y, 0, x, y, gr);
  g.addColorStop(0, `hsla(${o.hue},100%,60%,${0.4 * alpha})`);
  g.addColorStop(1, `hsla(${o.hue},100%,60%,0)`);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, gr, 0, TAU); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x, y);
  ctx.rotate(o.rot + Math.sin(t * 2 + o.seed) * 0.08);
  ctx.scale(sx, sy);

  // drop shadow
  ctx.save(); ctx.translate(0, r * 0.12); ctx.fillStyle = `hsla(${o.hue},80%,15%,.35)`; shapePath(o.shape, r); ctx.fill(); ctx.restore();

  // glossy body
  const f = ctx.createRadialGradient(-r * 0.35, -r * 0.45, r * 0.05, 0, 0, r * 1.3);
  f.addColorStop(0, `hsl(${o.hue},100%,82%)`);
  f.addColorStop(0.5, `hsl(${o.hue},92%,62%)`);
  f.addColorStop(1, `hsl(${o.hue},85%,44%)`);
  ctx.fillStyle = f; shapePath(o.shape, r); ctx.fill();
  if (o.shape !== 'flower') { ctx.lineWidth = r * 0.05; ctx.strokeStyle = `hsla(${o.hue},100%,92%,.45)`; ctx.stroke(); }

  // shine
  ctx.fillStyle = 'rgba(255,255,255,.45)';
  ctx.beginPath(); ctx.ellipse(-r * 0.36, -r * 0.44, r * 0.2, r * 0.1, -0.6, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(-r * 0.1, -r * 0.58, r * 0.045, 0, TAU); ctx.fill();

  const cy = (CENTER_Y[o.shape] || 0.02) * r;
  if (o.label) {
    const ls = spring(t - 0.07);
    ctx.save();
    ctx.translate(0, cy);
    ctx.rotate(Math.sin(t * 9) * 0.12 * Math.exp(-2 * t));
    ctx.scale(Math.max(ls, 0.001), Math.max(ls, 0.001));
    const fs = r * (o.shape === 'triangle' ? 0.8 : 1.02);
    ctx.font = `900 ${fs}px ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", system-ui, sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = `hsl(${o.hue},75%,30%)`;
    ctx.fillText(o.label, 0, fs * 0.1);
    ctx.fillStyle = '#fff';
    ctx.fillText(o.label, 0, fs * 0.04);
    ctx.restore();
  } else if (o.face) {
    drawFace(o, r, cy);
  }
  ctx.restore();
}

function drawTwinkle(x, y, s) {
  ctx.beginPath();
  ctx.moveTo(x, y - s);
  ctx.quadraticCurveTo(x, y, x + s, y);
  ctx.quadraticCurveTo(x, y, x, y + s);
  ctx.quadraticCurveTo(x, y, x - s, y);
  ctx.quadraticCurveTo(x, y, x, y - s);
  ctx.fill();
}

// The letter bubble for Find the letter / Challenge
function drawTarget(g, dt) {
  g.t += dt;
  g.wobble *= Math.pow(0.03, dt);
  let s = spring(g.t);
  if (g.dying) {
    g.dieT += dt;
    s *= Math.max(0, 1 - easeOutCubic(Math.min(1, g.dieT / 0.6)));
    if (g.dieT > 0.6) { if (game.target === g) game.target = null; return; }
  }
  const hint = mode === 'find' && g.t > 4 && !g.dying ? 1 + 0.07 * Math.sin(g.t * 6) : 1;
  const x = g.x + Math.sin(g.t * 1.3) * 10 + Math.sin(g.t * 45) * g.wobble * 20;
  const y = g.y + Math.sin(g.t * 1.7) * 9;
  const r = g.r * Math.max(s, 0) * hint;
  if (r < 1) return;
  const hue = g.dying ? 0 : g.hue;

  ctx.globalCompositeOperation = 'lighter';
  const glow = ctx.createRadialGradient(x, y, r * 0.6, x, y, r * 2);
  glow.addColorStop(0, `hsla(${hue},100%,60%,.35)`);
  glow.addColorStop(1, `hsla(${hue},100%,60%,0)`);
  ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(x, y, r * 2, 0, TAU); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';

  // soap-bubble body: clear middle, coloured rim
  const body = ctx.createRadialGradient(x - r * 0.2, y - r * 0.25, r * 0.1, x, y, r);
  body.addColorStop(0, `hsla(${hue},90%,70%,.12)`);
  body.addColorStop(0.7, `hsla(${hue},90%,62%,.28)`);
  body.addColorStop(1, `hsla(${hue},100%,72%,.7)`);
  ctx.fillStyle = body; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  ctx.lineWidth = Math.max(2, r * 0.035);
  ctx.strokeStyle = `hsla(${hue},100%,88%,.85)`; ctx.stroke();
  // rainbow sheen and shine
  ctx.lineCap = 'round';
  ctx.lineWidth = r * 0.07;
  ctx.strokeStyle = `hsla(${(hue + 120) % 360},100%,80%,.45)`;
  ctx.beginPath(); ctx.arc(x, y, r * 0.84, 0.15 * Math.PI, 0.55 * Math.PI); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.7)';
  ctx.beginPath(); ctx.ellipse(x - r * 0.42, y - r * 0.45, r * 0.2, r * 0.1, -0.7, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(x - r * 0.18, y - r * 0.64, r * 0.045, 0, TAU); ctx.fill();

  const fs = r * 1.05;
  ctx.font = `900 ${fs}px ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", system-ui, sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = `hsl(${hue},80%,28%)`;
  ctx.fillText(g.label, x, y + fs * 0.1);
  ctx.fillStyle = '#fff';
  ctx.fillText(g.label, x, y + fs * 0.04);
}

// A little keyboard at the bottom that lights up the key to press (Find the letter only)
const MINI_ROWS = ['QWERTYUIOP', 'ASDFGHJKL', 'ZXCVBNM'], MINI_OFFS = [0, 0.3, 0.8];
function drawMiniKeyboard(dt, now) {
  if (miniFlash) { miniFlash.t += dt; if (miniFlash.t > 0.6) miniFlash = null; }
  const ks = Math.min(W * 0.064, H * 0.07, 54), gap = ks * 0.16;
  const totalW = 10 * ks + 9 * gap, totalH = 3 * ks + 2 * gap;
  const x0 = (W - totalW) / 2, y0 = H - totalH - Math.max(22, H * 0.045);
  ctx.fillStyle = 'rgba(255,255,255,.05)';
  ctx.beginPath(); ctx.roundRect(x0 - gap * 2, y0 - gap * 2, totalW + gap * 4, totalH + gap * 4, ks * 0.45); ctx.fill();
  const tgt = game.target && !game.target.dying ? game.target : null;
  const pulse = 0.5 + 0.5 * Math.sin(now / 180);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `800 ${ks * 0.46}px ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", system-ui, sans-serif`;
  MINI_ROWS.forEach((row, r) => [...row].forEach((ch, c) => {
    const x = x0 + (c + MINI_OFFS[r]) * (ks + gap), y = y0 + r * (ks + gap);
    const isT = tgt && tgt.label === ch;
    const isWrong = miniFlash && miniFlash.label === ch;
    const lift = isT ? -ks * 0.12 * pulse : 0;
    ctx.save();
    if (isT) { ctx.shadowColor = `hsl(${tgt.hue},100%,60%)`; ctx.shadowBlur = 24; }
    ctx.fillStyle = isT ? `hsl(${tgt.hue},95%,${55 + pulse * 10}%)`
                  : isWrong ? `rgba(255,90,120,${0.8 * (1 - miniFlash.t / 0.6) + 0.1})`
                  : 'rgba(255,255,255,.11)';
    ctx.beginPath(); ctx.roundRect(x, y + lift, ks, ks, ks * 0.22); ctx.fill();
    ctx.restore();
    // key "edge" for a bit of depth
    ctx.fillStyle = 'rgba(0,0,0,.18)';
    ctx.fillRect(x + ks * 0.15, y + lift + ks - 3, ks * 0.7, 2);
    ctx.fillStyle = isT ? '#fff' : 'rgba(255,255,255,.55)';
    ctx.fillText(ch, x + ks / 2, y + lift + ks * 0.53);
  }));
}

function drawFloaters(dt) {
  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i]; f.t += dt;
    const p = f.t / f.life;
    if (p >= 1) { floaters.splice(i, 1); continue; }
    const sc = spring(f.t) * f.size;
    ctx.save();
    ctx.globalAlpha = p > 0.6 ? 1 - (p - 0.6) / 0.4 : 1;
    ctx.translate(f.x, f.y - easeOutCubic(p) * 80);
    ctx.scale(sc, sc);
    ctx.font = `900 ${Math.min(W, H) * 0.06}px ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", system-ui, sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = `hsl(${f.hue},80%,30%)`; ctx.fillText(f.text, 0, 4);
    ctx.fillStyle = '#fff'; ctx.fillText(f.text, 0, 0);
    ctx.restore();
  }
}

// Gentle floating bokeh so the screen is never still
const ambient = Array.from({ length: 45 }, () => ({ x: Math.random(), y: Math.random(), s: rand(1, 4), v: rand(0.01, 0.035), hue: rand(0, 360), ph: rand(0, TAU) }));
const RAINBOW = [0, 28, 52, 130, 195, 235, 280];
let last = performance.now(), clock = 0;

function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; clock += dt;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  // Background: deep base + drifting colour clouds
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#120d26';
  ctx.fillRect(0, 0, W, H);
  const R = Math.max(W, H) * 0.65;
  for (const b of blobs) {
    b.hue += (b.target - b.hue) * Math.min(1, dt * 1.5);
    const bx = W * (0.5 + Math.sin(clock * b.ax + b.px) * 0.4), by = H * (0.5 + Math.cos(clock * b.ay + b.py) * 0.4);
    const g = ctx.createRadialGradient(bx, by, 0, bx, by, R);
    g.addColorStop(0, `hsla(${b.hue},75%,42%,.32)`);
    g.addColorStop(1, `hsla(${b.hue},75%,42%,0)`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  for (let i = flashes.length - 1; i >= 0; i--) {
    const f = flashes[i]; f.t += dt;
    const p = f.t / f.life;
    if (p >= 1) { flashes.splice(i, 1); continue; }
    const fr = Math.max(W, H) * (f.big ? 1.2 : 0.7) * (0.4 + p * 0.6);
    const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, fr);
    g.addColorStop(0, `hsla(${f.hue},100%,65%,${0.35 * (1 - p)})`);
    g.addColorStop(1, `hsla(${f.hue},100%,65%,0)`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }

  // Idle attract mode: friendly faces drift in to say hi
  const idle = (mode === 'free' || !started) && now - lastPress > 7000;
  if (idle) {
    idleTimer -= dt;
    if (idleTimer <= 0) {
      idleTimer = started ? 2.4 : 1.6;
      burst(rand(0.12, 0.88) * W, rand(0.15, 0.85) * H, rand(0, 360), { face: true, size: 0.7, quiet: true });
    }
  } else idleTimer = 0.8;

  // Camera shake (foreground only)
  shake *= Math.pow(0.004, dt);
  if (shake > 0.3) ctx.translate(rand(-shake, shake), rand(-shake, shake));

  ctx.globalCompositeOperation = 'lighter';
  for (const a of ambient) {
    a.y -= a.v * dt * (idle ? 2 : 1);
    if (a.y < -0.02) { a.y = 1.02; a.x = Math.random(); }
    const tw = 0.5 + 0.5 * Math.sin(clock * 2 + a.ph);
    ctx.fillStyle = `hsla(${a.hue},90%,70%,${(idle ? 0.45 : 0.25) * (0.5 + tw * 0.5)})`;
    ctx.beginPath(); ctx.arc(a.x * W + Math.sin(clock * 0.7 + a.ph) * 12, a.y * H, a.s * (idle ? 1.8 : 1), 0, TAU); ctx.fill();
  }

  // Rainbow arc (spacebar)
  ctx.globalCompositeOperation = 'source-over';
  for (let i = rainbows.length - 1; i >= 0; i--) {
    const rb = rainbows[i]; rb.t += dt;
    const p = rb.t / rb.life;
    if (p >= 1) { rainbows.splice(i, 1); continue; }
    const sweep = easeOutCubic(Math.min(1, rb.t / 0.9));
    const alpha = p > 0.7 ? 1 - (p - 0.7) / 0.3 : 1;
    const Rr = Math.min(W * 0.46, H * 0.78), band = Rr * 0.075, cx = W / 2, cyy = H * 0.98;
    ctx.lineCap = 'round';
    RAINBOW.forEach((h, j) => {
      ctx.strokeStyle = `hsla(${h},95%,62%,${alpha * 0.9})`;
      ctx.lineWidth = band * 0.92;
      ctx.beginPath(); ctx.arc(cx, cyy, Rr - j * band, Math.PI, Math.PI + Math.PI * sweep); ctx.stroke();
    });
    // a sparkle at the leading tip
    if (sweep < 1) {
      const a = Math.PI + Math.PI * sweep, rr = Rr - 3 * band;
      addPart({ kind: 'twinkle', x: cx + Math.cos(a) * rr, y: cyy + Math.sin(a) * rr, vx: rand(-60, 60), vy: rand(-60, 60), hue: rand(0, 360), size: rand(8, 14), t: 0, life: 0.8, drag: 0.2, g: 0 });
    }
  }

  // Rings
  ctx.globalCompositeOperation = 'lighter';
  for (let i = rings.length - 1; i >= 0; i--) {
    const g = rings[i]; g.t += dt;
    if (g.t < 0) continue;
    const p = g.t / g.life;
    if (p >= 1) { rings.splice(i, 1); continue; }
    ctx.strokeStyle = `hsla(${g.hue},95%,65%,${(1 - p) * 0.9})`;
    ctx.lineWidth = g.w * (1 - p) + 1;
    ctx.beginPath(); ctx.arc(g.x, g.y, g.maxR * easeOutCubic(p), 0, TAU); ctx.stroke();
  }

  // Rockets (Enter)
  for (let i = rockets.length - 1; i >= 0; i--) {
    const r = rockets[i];
    if (r.wait > 0) { r.wait -= dt; continue; }
    r.vy += 900 * dt; r.x += r.vx * dt; r.y += r.vy * dt;
    addPart({ kind: 'dot', x: r.x, y: r.y, vx: rand(-30, 30), vy: rand(20, 80), hue: 40, size: rand(2, 4), t: 0, life: rand(0.3, 0.6), drag: 0.3, g: 100 });
    ctx.fillStyle = `hsl(${r.hue},100%,80%)`;
    ctx.beginPath(); ctx.arc(r.x, r.y, 5, 0, TAU); ctx.fill();
    if (r.vy >= -30) { explode(r); rockets.splice(i, 1); }
  }

  // Particles
  for (let i = parts.length - 1; i >= 0; i--) {
    const q = parts[i]; q.t += dt;
    const p = q.t / q.life;
    if (p >= 1) { parts.splice(i, 1); continue; }
    const d = Math.pow(q.drag, dt);
    q.vx *= d; q.vy = q.vy * d + q.g * dt;
    q.x += q.vx * dt; q.y += q.vy * dt;
    const a = 1 - p * p;
    if (q.kind === 'dot') {
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = `hsla(${q.hue},95%,65%,${a})`;
      ctx.beginPath(); ctx.arc(q.x, q.y, q.size * (1 - p * 0.6), 0, TAU); ctx.fill();
    } else if (q.kind === 'twinkle') {
      ctx.globalCompositeOperation = 'lighter';
      const tw = 0.6 + 0.4 * Math.sin(q.t * 18 + q.size);
      ctx.fillStyle = `hsla(${q.hue},100%,85%,${a * tw})`;
      drawTwinkle(q.x, q.y, q.size * (p < 0.2 ? p / 0.2 : 1) * tw);
    } else {
      ctx.globalCompositeOperation = 'source-over';
      q.rot += q.vr * dt;
      q.x += Math.sin(q.t * 4 + q.size) * 30 * dt;
      ctx.save();
      ctx.translate(q.x, q.y); ctx.rotate(q.rot); ctx.scale(1, Math.cos(q.t * 9 + q.size));
      ctx.fillStyle = `hsla(${q.hue},90%,${60 + Math.sin(q.t * 9) * 12}%,${a})`;
      ctx.fillRect(-q.size / 2, -q.size / 4, q.size, q.size / 2);
      ctx.restore();
    }
  }

  // Shapes on top
  ctx.globalCompositeOperation = 'source-over';
  for (let i = pops.length - 1; i >= 0; i--) {
    const o = pops[i]; o.t += dt;
    o.y -= 14 * dt;
    if (o.t >= o.life) { pops.splice(i, 1); continue; }
  }
  for (const o of pops) drawPop(o);
  if (game.target) drawTarget(game.target, dt);
  if (mode === 'find' && started) drawMiniKeyboard(dt, now);
  drawFloaters(dt);

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
